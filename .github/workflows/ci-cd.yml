name: Angular CI/CD

on:
  push:
    branches:
      - ci-cd   # <-- your branch name

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Angular
      run: npm run build -- --output-path=dist/ci-cd/browser

